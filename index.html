<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zoom VideoSDK Content Moderation</title>
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-50 via-white to-slate-100 text-slate-800 antialiased">
  <header class="sticky top-0 z-10 border-b border-slate-200/70 bg-white/80 backdrop-blur">
    <div class="mx-auto max-w-6xl px-6 py-5">
      <h1 class="text-2xl font-semibold tracking-tight text-slate-900">Zoom VideoSDK Content Moderation</h1>
      <p class="mt-1 text-sm text-slate-500">Real-time video processing with on-device content detection</p>
    </div>
  </header>

  <main class="mx-auto flex w-full max-w-6xl flex-col gap-8 px-6 py-10 pb-24">
    <section class="flex flex-col items-center gap-4 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
      <div class="flex w-full max-w-xs flex-row justify-center">
        <button id="start-btn" class="w-full rounded-lg bg-indigo-600 px-4 py-2.5 font-semibold text-white shadow-sm transition-colors hover:bg-indigo-700 active:bg-indigo-800 disabled:cursor-not-allowed disabled:opacity-60">
          Join
        </button>
        <button id="stop-btn" class="hidden w-full rounded-lg bg-red-600 px-4 py-2.5 font-semibold text-white shadow-sm transition-colors hover:bg-red-700 active:bg-red-800">
          Leave
        </button>
      </div>
      <div class="flex w-full max-w-xs flex-row justify-center">
        <button id="toggle-video-btn" class="hidden w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm font-semibold text-slate-700 shadow-sm transition-colors hover:bg-slate-50 active:bg-slate-100">
          Toggle Video
        </button>
      </div>
    </section>

    <section id="video-section" class="video-panel hidden">
      <video-player-container></video-player-container>
    </section>
  </main>

  <footer class="fixed inset-x-0 bottom-0 border-t border-slate-200 bg-white/85 px-4 py-2.5 text-center text-xs text-slate-500 backdrop-blur">
    Do not expose your SDK Secret to the client. When using this in production,
    please use a backend service to sign tokens.
  </footer>
  <script src="/coi-serviceworker.js"></script>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
